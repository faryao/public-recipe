<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
        <span>食</span>{{ site.title }}
      </a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#recipes">食谱</a>
        <a class="nav-write" href="https://github.com/{{ site.github_username }}/{{ site.repository_name }}/new/main/_recipes?value=---%0Alayout%3A%20recipe%0Atitle%3A%20%0A---%0A" target="_blank" rel="noreferrer">写一道菜</a>
        <a href="https://github.com/{{ site.github_username }}/{{ site.repository_name }}" target="_blank" rel="noreferrer">GitHub ↗</a>
      </nav>
    </header>

    <main>{{ content }}</main>

    <footer>
      <p>用心烹饪，认真记录。</p>
      <p>© <span id="year"></span> {{ site.author }}</p>
    </footer>
    <script src="{{ '/assets/lib/linkify-4.3.3.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/lib/pangu-8.2.0.js' | relative_url }}"></script>
    <script src="{{ '/assets/app.js' | relative_url }}"></script>
  </body>
</html>
